name: gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Python requirements
        run: python -m pip install -r requirements.txt
      - name: Test suite
        run: python -m pytest tests/ -q -rsxX --junitxml="$RUNNER_TEMP/tests.xml"
      - name: Pilot tests
        working-directory: pilot/titania-super-multiscale
        run: python -m pytest tests/ -q -rsxX --junitxml="$RUNNER_TEMP/pilot.xml"
      - name: No skipped or xfailed test
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          for name in ('tests.xml', 'pilot.xml'):
              root = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], name)).getroot()
              n = sum(int(s.get('skipped', 0)) for s in root.iter('testsuite'))
              assert n == 0, f'{name}: {n} skipped or xfailed'
          PY
      - name: Browser for the page check
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Page check
        run: PW_DIR="$RUNNER_TEMP/pw" python scripts/check_page.py
